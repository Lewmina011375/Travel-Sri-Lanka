spring.application.name=travel-backend
server.port=8080


#   CREATE DATABASE travel_db;
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=travel_db;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=123
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Uploaded images (served under /uploads/**)
app.upload.dir=uploads

# Default admin (created on startup; password re-synced when app.admin.sync-password=true)
app.admin.username=admin
app.admin.password=admin123
app.admin.sync-password=true
